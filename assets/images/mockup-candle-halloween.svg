<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <radialGradient id="flameGlowHW" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff2c4"/>
      <stop offset="45%" stop-color="#f5a742"/>
      <stop offset="100%" stop-color="#f5a742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jarGlassHW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2622"/>
      <stop offset="12%" stop-color="#3d3833"/>
      <stop offset="50%" stop-color="#1f1c19"/>
      <stop offset="88%" stop-color="#3d3833"/>
      <stop offset="100%" stop-color="#2a2622"/>
    </linearGradient>
    <linearGradient id="waxHW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8823a"/>
      <stop offset="100%" stop-color="#d9701f"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="200" cy="430" rx="110" ry="14" fill="#000" opacity="0.08"/>

  <!-- flame + glow -->
  <circle cx="200" cy="145" r="70" fill="url(#flameGlowHW)"/>
  <path d="M200 105 C 212 130 222 145 210 165 C 205 175 195 175 190 165 C 180 145 188 128 200 105 Z" fill="#f7c948"/>
  <path d="M200 122 C 206 136 210 145 204 156 C 201 161 199 161 196 156 C 191 145 194 134 200 122 Z" fill="#fff6d6"/>

  <!-- wick -->
  <rect x="198" y="163" width="4" height="16" fill="#3a332c"/>

  <!-- wax top -->
  <ellipse cx="200" cy="180" rx="78" ry="14" fill="url(#waxHW)"/>

  <!-- jar body -->
  <path d="M122 180 L122 380 Q122 400 145 400 L255 400 Q278 400 278 380 L278 180 Z" fill="url(#jarGlassHW)"/>
  <ellipse cx="200" cy="180" rx="78" ry="13" fill="#141210" opacity="0.5"/>

  <!-- jar rim -->
  <rect x="176" y="160" width="48" height="22" rx="6" fill="#4a433c"/>
  <ellipse cx="200" cy="160" rx="24" ry="7" fill="#5c5349"/>

  <!-- little pumpkin-orange leaf accents -->
  <path d="M108 220 q-14 6 -10 22 q14 2 20 -12 q2 -8 -10 -10 Z" fill="#d9701f" opacity="0.85"/>
  <path d="M292 300 q14 6 10 22 q-14 2 -20 -12 q-2 -8 10 -10 Z" fill="#8ea77b" opacity="0.85"/>

  <!-- label -->
  <rect x="140" y="255" width="120" height="110" rx="10" fill="#fbf6ea" stroke="#e6e0d0" stroke-width="1.5"/>
  <image xlink:href="logo-icon.png" href="logo-icon.png" x="163" y="262" width="74" height="58" preserveAspectRatio="xMidYMid meet"/>
  <text x="200" y="333" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="13" fill="#454239">Mashallah Arts</text>
  <text x="200" y="350" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#8a5a1e">Autumn Harvest</text>
</svg>
