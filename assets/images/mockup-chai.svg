<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 460" width="440" height="460">
  <defs>
    <linearGradient id="thermosBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#96a988"/>
      <stop offset="10%" stop-color="#b7c7ab"/>
      <stop offset="50%" stop-color="#8ea77b"/>
      <stop offset="90%" stop-color="#b7c7ab"/>
      <stop offset="100%" stop-color="#96a988"/>
    </linearGradient>
    <linearGradient id="chaiLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a4b"/>
      <stop offset="100%" stop-color="#a5652c"/>
    </linearGradient>
    <linearGradient id="mugBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efe8d6"/>
      <stop offset="50%" stop-color="#fbf6ea"/>
      <stop offset="100%" stop-color="#efe8d6"/>
    </linearGradient>
  </defs>

  <ellipse cx="220" cy="430" rx="150" ry="14" fill="#000" opacity="0.08"/>

  <!-- steam -->
  <path d="M120 210 q-10 -20 0 -34 q10 -14 0 -30" fill="none" stroke="#c9c2b2" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M140 200 q10 -18 0 -32 q-10 -14 0 -28" fill="none" stroke="#c9c2b2" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- mug -->
  <path d="M92 226 L100 330 Q102 348 120 348 L168 348 Q186 348 188 330 L196 226 Z" fill="url(#mugBody)" stroke="#e6e0d0" stroke-width="1.5"/>
  <ellipse cx="144" cy="226" rx="52" ry="10" fill="url(#chaiLiquid)"/>
  <path d="M188 250 q30 4 28 30 q-2 24 -30 24" fill="none" stroke="#efe8d6" stroke-width="10" stroke-linecap="round"/>

  <!-- thermos -->
  <rect x="235" y="150" width="130" height="30" rx="10" fill="#5c5349"/>
  <rect x="255" y="130" width="90" height="26" rx="8" fill="#454239"/>
  <path d="M240 178 L250 400 Q252 414 268 414 L332 414 Q348 414 350 400 L360 178 Z" fill="url(#thermosBody)" stroke="#6a8459" stroke-width="1.5"/>
  <rect x="240" y="230" width="120" height="70" fill="#fbf6ea" opacity="0.92" stroke="#e6e0d0" stroke-width="1.5"/>

  <!-- label on thermos -->
  <image xlink:href="logo-icon.png" href="logo-icon.png" x="265" y="236" width="70" height="55" preserveAspectRatio="xMidYMid meet"/>
  <text x="300" y="305" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="13" fill="#454239">Mashallah Arts</text>
  <text x="300" y="322" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#8a5a1e">Fresh &amp; Hot Chai</text>
</svg>
